name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WorkbenchUI.Wpf.slnx

      - name: Build
        run: dotnet build WorkbenchUI.Wpf.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WorkbenchUI.Wpf.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack WorkbenchUI.Wpf.slnx -c Release --no-build -o artifacts/nupkg

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*
